name: build-and-test

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  SBT_OPTS: -Dsbt.log.noformat=true

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ 'pull_request' != github.event_name || (github.event.pull_request.head.repo.git_url != github.event.pull_request.base.repo.git_url) }}
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@b173b6ec0100793626c2d9e6b90435061f4fc3e5 # 0.11.0
        with:
          access_token: ${{ github.token }}

      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f # v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'

      - uses: sbt/setup-sbt@2e222825582620cc38d2a54e674f3c01b7c14f5d # v1

      # Node.js setup should come after GraalVM setup as GraalVM includes a conflicting `node` binary
      # and we want the "regular" node version to "win".  -Jeremy B June 2021
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: engine/package-lock.json

      - name: Git Init
        run: git submodule update --init --recursive

      - name: Environment Info
        run: |
          ./sbt.sh version
          echo "** PATH"
          echo $PATH
          echo "** node path and version"
          readlink -f `which node`
          node --version
          echo "** JAVA_HOME"
          echo $JAVA_HOME
          echo "** java path and version"
          readlink -f `which java`
          java -version
          echo "** javac path and version"
          readlink -f `which javac`
          javac -version

      - name: Compile All
        run: |
          ./sbt.sh "compilerJVM / Test / compile"
          ./sbt.sh "compilerJS / Test / compile"
          ./sbt.sh "netLogoWeb / Test / compile"

      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        id: restore-build
        with:
          path: ./*
          key: ${{ github.sha }}

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        id: restore-build
        with:
          path: ./*
          key: ${{ github.sha }}

      - uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f # v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'

      - uses: sbt/setup-sbt@2e222825582620cc38d2a54e674f3c01b7c14f5d # v1

      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: engine/package-lock.json

      - name: Scalastyle
        run: |
          ./sbt.sh netLogoWeb/scalastyle compilerCore/scalastyle compilerJVM/scalastyle compilerJS/scalastyle macrosCore/scalastyle

      - name: Coffeelint
        run: |
          ./sbt.sh engine/coffeelint

  test-compiler:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        id: restore-build
        with:
          path: ./*
          key: ${{ github.sha }}

      - uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f # v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'

      - uses: sbt/setup-sbt@2e222825582620cc38d2a54e674f3c01b7c14f5d # v1

      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: engine/package-lock.json

      - name: Compiler JVM Tests
        run: |
          ./sbt.sh "compilerJVM / Test / test"
          ./sbt.sh "compilerJVM / depend"

      - name: Compiler JS Tests
        run: |
          ./sbt.sh "compilerJS / Test / test"

  test-web-fast:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        id: restore-build
        with:
          path: ./*
          key: ${{ github.sha }}

      - uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f # v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'

      - uses: sbt/setup-sbt@2e222825582620cc38d2a54e674f3c01b7c14f5d # v1

      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: engine/package-lock.json

      - name: NetLogo Web Fast Tests
        run: |
          ./sbt.sh "netLogoWeb / Test / runMain org.nlogo.tortoise.nlw.ExtensionsInstaller"
          ./sbt.sh "netLogoWeb / Test / fast"
          ./sbt.sh "netLogoWeb / testOnly *TestReporters"

  test-web-commands:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        id: restore-build
        with:
          path: ./*
          key: ${{ github.sha }}

      - uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f # v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'

      - uses: sbt/setup-sbt@2e222825582620cc38d2a54e674f3c01b7c14f5d # v1

      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: engine/package-lock.json

      - name: NetLogo Web Command Tests
        run: |
          ./sbt.sh "netLogoWeb / testOnly *TestCommands"

  test-dumps:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        id: restore-build
        with:
          path: ./*
          key: ${{ github.sha }}

      - uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f # v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'

      - uses: sbt/setup-sbt@2e222825582620cc38d2a54e674f3c01b7c14f5d # v1

      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: engine/package-lock.json

      - name: Model JS Dumps
        run: |
          ./sbt.sh "netLogoWeb / testOnly *ModelDumpTests"

  test-models:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        test: ["-z 0 -z 1", "-z 2", "-z 3", "-z 4", "-z 5", "-z 6", "-z 7", "-z 8", "-z 9"]

    steps:
      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        id: restore-build
        with:
          path: ./*
          key: ${{ github.sha }}

      - uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f # v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'

      - uses: sbt/setup-sbt@2e222825582620cc38d2a54e674f3c01b7c14f5d # v1

      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: engine/package-lock.json

      - name: Model Docking Tests ${{ matrix.test }}
        run: ./sbt.sh "netLogoWeb / testOnly *TestModels -- ${{ matrix.test }}"
